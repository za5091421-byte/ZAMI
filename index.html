<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <title>CYBERPUNK HUD v6.0</title>
    <style>
        
        :root {
            --bg: #05010f;
            --bg2: #0b0620;
            --bg3: #160b2e;
            --panel: rgb(15, 8, 30);
            --border: rgba(5,217,232, 0.25);
            --border-bright: rgba(5,217,232, 0.7);
            --sp-green: #05d9e8;
            --sp-lime: #ff2079;
            --sp-gold: #ffc400;
            --sp-teal: #9d4edd;
            --sp-blue: #3a8fff;
            --sp-red: #ff0844;
            --sp-orange: #ff6b35;
            --sp-purple: #b026ff;
            --text: #e0f7ff;
            --text-dim: rgba(190,225,255,0.5);
            --glow-green: 0 0 20px rgba(5,217,232,0.5), 0 0 60px rgba(5,217,232,0.2);
            --glow-gold: 0 0 20px rgba(255,196,0,0.5), 0 0 60px rgba(255,196,0,0.2);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        /* ====== HUD SIZE (Settings) ======
           Mengubah "zoom" pada elemen root supaya SELURUH tampilan (yang
           campuran unit px/rem) ikut membesar/mengecil secara proporsional,
           tanpa merusak position:fixed (notif, achievement popup, dll) —
           beda dengan transform:scale yang bikin fixed jadi tidak akurat. */
        html[data-hud="small"] { zoom: 0.85; }
        html[data-hud="medium"] { zoom: 1; }
        html[data-hud="large"] { zoom: 1.15; }
        .settings-group { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 18px 20px; margin-bottom: 16px; }
        .settings-group-title { font-family: 'Orbitron', sans-serif; font-size: 0.6rem; letter-spacing: 3px; opacity: 0.6; margin-bottom: 12px; }
        .settings-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        .settings-desc { font-size: 0.65rem; opacity: 0.5; margin-top: 10px; line-height: 1.6; }
        .hud-size-btn, .theme-mode-btn { padding: 8px 18px; font-family: inherit; font-size: 0.65rem; letter-spacing: 1px; cursor: pointer; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--text-dim); transition: all 0.2s; }
        .hud-size-btn.active, .theme-mode-btn.active { border-color: var(--sp-green); color: var(--sp-green); background: rgba(5,217,232,0.1); box-shadow: 0 0 10px rgba(5,217,232,0.15); }
        .settings-refresh-btn { padding: 10px 22px; font-family: inherit; font-size: 0.65rem; letter-spacing: 1px; cursor: pointer; border-radius: 8px; border: 1px solid var(--sp-red); background: rgba(255,8,68,0.08); color: var(--sp-red); transition: all 0.2s; }
        .settings-refresh-btn:hover { background: rgba(255,8,68,0.18); box-shadow: 0 0 14px rgba(255,8,68,0.25); }
        body {
            font-family: 'JetBrains Mono', monospace;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        #bg{position:fixed;inset:0;z-index:0;width:100%;height:100%;object-fit:cover;
  filter:brightness(0.2) saturate(1);transition:filter .5s}
[data-theme="light"] #bg{filter:brightness(1) hue-rotate(100deg);opacity:1}
        /* ====== CANVAS BACKGROUND ====== */
        #bg-canvas {
            position: fixed; top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 0; pointer-events: none;
            opacity: 0.4;
        }
        #grid-overlay{position:fixed;inset:0;z-index:0;pointer-events:none;
          background-image:linear-gradient(rgba(5,217,232,.04) 1px,transparent 1px),
            linear-gradient(90deg,rgba(5,217,232,.04) 1px,transparent 1px);
          background-size:42px 42px;animation:gridDrift 44s linear infinite}
        @keyframes gridDrift{from{background-position:0 0}to{background-position:42px 42px}}
        #scanline{position:fixed;left:0;width:100%;height:2px;z-index:9999;pointer-events:none;
          background:linear-gradient(90deg,transparent,rgba(5,217,232,.35) 30%,rgba(157,78,221,.4) 70%,transparent);
          animation:scanMove 9s linear infinite;filter:blur(1px)}
        @keyframes scanMove{from{top:-2px}to{top:100%}}

        /* ====== LAYOUT ====== */
        .layout {
            display: flex;
            min-height: 100vh;
            position: relative;
            z-index: 1;
        }

        /* ====== SIDEBAR ====== */
        .sidebar {
            width: 260px;
            min-width: 260px;
            background: rgb(15, 8, 30);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 0;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
            z-index: 100;
            transition: width .38s cubic-bezier(0.4,0,0.2,1), min-width .38s cubic-bezier(0.4,0,0.2,1),
                        opacity .3s ease, border-color .3s ease;
        }
        .sidebar::-webkit-scrollbar { width: 3px; }
        .sidebar::-webkit-scrollbar-thumb { background: var(--sp-green); border-radius: 2px; }

        /* ====== AUTO-HIDE HUD KIRI ======
           Sidebar collapses to width 0 until the cursor approaches the left
           edge of the screen (or hovers the sidebar itself). .main uses
           flex:1 so the center content smoothly expands/contracts to fill
           the freed-up space (responsive tengah). */
        body.sidebar-autohide .sidebar {
            width: 0;
            min-width: 0;
            padding: 0;
            opacity: 0;
            overflow: hidden;
            border-right-color: transparent;
            pointer-events: none;
        }
        body.sidebar-autohide .sidebar.sb-visible {
            width: 260px;
            min-width: 260px;
            opacity: 1;
            overflow-y: auto;
            border-right-color: var(--border);
            pointer-events: auto;
        }
        /* thin invisible hot-zone at the very left edge to catch the cursor
           even while the sidebar is fully collapsed */
        #edge-hotzone-left {
            position: fixed; left: 0; top: 0; width: 18px; height: 100vh;
            z-index: 250; background: transparent;
        }
        body.sidebar-autohide.sidebar-open #edge-hotzone-left { pointer-events: none; }
        /* small tab hint so it's clear the HUD can be revealed */
        #edge-hint {
            position: fixed; left: 0; top: 50%; transform: translateY(-50%);
            width: 5px; height: 70px; border-radius: 0 6px 6px 0;
            background: linear-gradient(180deg, var(--sp-green), var(--sp-lime));
            box-shadow: 0 0 12px rgba(5,217,232,0.5);
            z-index: 240; opacity: .55; transition: opacity .3s ease, width .3s ease;
        }
        body.sidebar-autohide.sidebar-open #edge-hint { opacity: 0; width: 0; }

        .sidebar-header {
            padding: 20px 18px 10px;
            border-bottom: 1px solid var(--border);
        }
        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.7rem;
            font-weight: 900;
            letter-spacing: 3px;
            color: var(--sp-lime);
            text-shadow: 0 0 20px var(--sp-lime);
        }
        .logo-sub { font-size: 0.55rem; opacity: 0.5; letter-spacing: 4px; margin-top: 2px; }

        /* CLOCK */
        #sb-clock {
            padding: 12px 18px;
            border-bottom: 1px solid var(--border);
            text-align: center;
        }
        #sb-time {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--sp-green);
            text-shadow: var(--glow-green);
            letter-spacing: 2px;
        }
        #sb-date { font-size: 0.55rem; opacity: 0.5; margin-top: 3px; letter-spacing: 2px; }
        #sb-period { font-size: 0.65rem; margin-top: 4px; letter-spacing: 3px; }

        /* ENERGY BAR */
        .energy-section {
            padding: 12px 18px;
            border-bottom: 1px solid var(--border);
        }
        .energy-label { font-size: 0.55rem; letter-spacing: 3px; opacity: 0.6; margin-bottom: 6px; }
        .energy-bar-wrap {
            height: 8px; background: rgba(255,255,255,0.05);
            border-radius: 4px; overflow: hidden;
            border: 1px solid var(--border);
        }
        .energy-bar-fill {
            height: 100%; background: linear-gradient(90deg, var(--sp-green), var(--sp-lime));
            border-radius: 4px; transition: width 0.6s ease;
            box-shadow: 0 0 10px var(--sp-green);
        }
        .energy-stats { display: flex; justify-content: space-between; margin-top: 6px; font-size: 0.6rem; opacity: 0.7; }

        /* NAV */
        .nav-section { padding: 8px 10px; flex: 1; }
        .nav-btn {
            width: 100%; padding: 10px 14px;
            background: transparent; border: 1px solid transparent;
            color: var(--text); font-family: inherit; font-size: 1rem;
            font-weight: 500; letter-spacing: 1px;
            cursor: pointer; border-radius: 6px;
            transition:0.25s; 
            text-align: left;
            display: flex; align-items: center; gap: 10px;
            margin-bottom: 2px;
        }
        .nav-btn:hover { 
            font-size: 1.5rem;
            border-color: var(--border); 
            background: rgba(5,217,232,0.05); 
            color: var(--sp-green); 
        }
        .nav-btn.active { border-color: var(--sp-green); background: rgba(5,217,232,0.1); color: var(--sp-lime); text-shadow: 0 0 10px var(--sp-lime); }
        .nav-btn .badge { margin-left: auto; font-size: 0.6rem; background: var(--sp-red); color: white; padding: 1px 6px; border-radius: 10px; }

        /* STREAK */
        .streak-section {
            padding: 12px 18px;
            border-top: 1px solid var(--border);
            display: flex; align-items: center; gap: 12px;
        }
        .streak-orb {
            width: 44px; height: 44px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Orbitron', sans-serif; font-size: 1.1rem; font-weight: 900;
            border: 2px solid var(--sp-green); color: var(--sp-green);
            box-shadow: 0 0 15px rgba(5,217,232,0.3);
            transition: all 0.4s; flex-shrink: 0;
        }
        .streak-orb.hot { border-color: var(--sp-gold); color: var(--sp-gold); box-shadow: 0 0 20px rgba(255,196,0,0.5); animation: orbPulse 1.5s ease-in-out infinite; }
        .streak-orb.fire { border-color: var(--sp-red); color: var(--sp-red); box-shadow: 0 0 25px rgba(255,8,68,0.6); animation: orbPulse 0.8s ease-in-out infinite; }
        @keyframes orbPulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.08)} }
        .streak-info { flex: 1; min-width: 0; }
        .streak-lbl { font-size: 0.6rem; opacity: 0.6; letter-spacing: 2px; }
        .streak-status { font-size: 0.65rem; font-weight: 700; color: var(--sp-green); margin-top: 2px; }

        /* AMBIENT */
        .ambient-section {
            padding: 8px 18px;
            border-top: 1px solid var(--border);
        }
        .ambient-btn {
            width: 100%; padding: 8px; font-family: inherit; font-size: 0.65rem;
            letter-spacing: 2px; cursor: pointer; border-radius: 4px;
            background: rgba(5,217,232,0.05); border: 1px solid var(--border);
            color: var(--text-dim); transition: all 0.3s;
        }
        .ambient-btn:hover, .ambient-btn.playing { border-color: var(--sp-teal); color: var(--sp-teal); background: rgba(157,78,221,0.1); text-shadow: 0 0 10px var(--sp-teal); }

        /* ====== MAIN CONTENT ====== */
        .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0;
            transition: width .38s cubic-bezier(0.4,0,0.2,1); }

        /* TOPBAR */
        .topbar {
            padding: 16px 30px;
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; gap: 20px;
            background: rgba(11,5,26,0.7);
            backdrop-filter: blur(20px);
            position: sticky; top: 0; z-index: 50;
        }
        .page-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.6rem; font-weight: 700;
            color: var(--sp-lime); letter-spacing: 2px;
            text-shadow: 0 0 20px var(--sp-lime);
            flex: 1;
        }
        .topbar-actions { display: flex; gap: 10px; align-items: center; }
        .view-toggle { display: flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
        .view-btn {
            padding: 7px 14px; font-family: inherit; font-size: 0.7rem;
            cursor: pointer; background: transparent; border: none; color: var(--text-dim);
            transition: all 0.2s; letter-spacing: 1px;
        }
        .view-btn.active { background: rgba(5,217,232,0.15); color: var(--sp-green); }
        .action-btn {
            padding: 8px 18px; font-family: inherit; font-size: 0.7rem; font-weight: 700;
            letter-spacing: 1px; cursor: pointer; border-radius: 6px; transition: all 0.3s;
        }
        .btn-create { background: linear-gradient(135deg, var(--sp-green), var(--sp-lime)); border: none; color: var(--bg); box-shadow: 0 0 20px rgba(5,217,232,0.3); }
        .btn-create:hover { transform: translateY(-2px); box-shadow: 0 4px 30px rgba(5,217,232,0.5); }
        .btn-ai { background: transparent; border: 1px solid var(--sp-purple); color: var(--sp-purple); }
        .btn-ai:hover { background: rgba(176,38,255,0.1); box-shadow: 0 0 20px rgba(176,38,255,0.3); }

        /* ====== CONTENT AREA ====== */
        .content { padding: 36px 48px; flex: 1; overflow-y: auto; font-size: 1.08rem; max-width: 1500px; margin: 0 auto; width: 100%; }
        .content::-webkit-scrollbar { width: 4px; }
        .content::-webkit-scrollbar-thumb { background: var(--sp-green); border-radius: 2px; opacity: 0.5; }

        /* ====== TASK GRID ====== */
        .task-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 20px; }

        .task-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px; padding: 24px;
            cursor: pointer; position: relative;
            overflow: hidden; transition: all 0.3s cubic-bezier(0.2,0.8,0.2,1);
            backdrop-filter: blur(10px);
        }
        .task-card::after {
            content: ''; position: absolute; top: 0; left: 0; right: 0;
            height: 2px; background: linear-gradient(90deg, transparent, var(--sp-green), transparent);
            opacity: 0; transition: opacity 0.3s;
        }
        .task-card:hover { border-color: var(--border-bright); transform: translateY(-4px); box-shadow: 0 8px 30px rgba(5,217,232,0.15); }
        .task-card:hover::after { opacity: 1; }
        .task-card.working { border-color: var(--sp-teal); box-shadow: 0 0 25px rgba(157,78,221,0.25); animation: workingPulse 2s ease-in-out infinite; }
        @keyframes workingPulse { 0%,100%{box-shadow:0 0 25px rgba(157,78,221,0.2)} 50%{box-shadow:0 0 40px rgba(157,78,221,0.4)} }

        /* ====== AI VOICE HIGHLIGHT ======
           Diberikan ke kartu/item yang sedang disebutkan oleh suara AI.
           Sedikit membesar + glow, tidak berlebihan, lalu kembali normal. */
        .task-card.ai-highlight {
            transform: scale(1.045) translateY(-4px);
            border-color: var(--sp-teal) !important;
            box-shadow: 0 0 22px rgba(157,78,221,0.45), 0 0 55px rgba(157,78,221,0.2);
            z-index: 6;
        }
        .routine-item.ai-highlight {
            transform: scale(1.03);
            background: rgba(157,78,221,0.1);
            box-shadow: 0 0 16px rgba(157,78,221,0.4);
            border-radius: 6px;
            z-index: 6;
            transition: transform 0.3s cubic-bezier(0.2,0.8,0.2,1), background 0.3s ease, box-shadow 0.3s ease;
        }
        .kanban-card.ai-highlight {
            transform: scale(1.045);
            border-color: var(--sp-teal);
            box-shadow: 0 0 20px rgba(157,78,221,0.45);
            z-index: 6;
            transition: transform 0.3s cubic-bezier(0.2,0.8,0.2,1), box-shadow 0.3s ease;
        }
        .task-card.p-sangat-penting { border-left: 3px solid var(--sp-red); }
        .task-card.p-penting { border-left: 3px solid var(--sp-orange); }
        .task-card.p-normal { border-left: 3px solid var(--sp-green); }

        .card-prio-tag {
            display: inline-block; font-size: 0.5rem; letter-spacing: 2px;
            padding: 2px 8px; border-radius: 2px; margin-bottom: 10px;
            font-weight: 700;
        }
        .tag-sp { background: rgba(255,8,68,0.2); color: var(--sp-red); border: 1px solid rgba(255,8,68,0.3); }
        .tag-p { background: rgba(255,107,53,0.2); color: var(--sp-orange); border: 1px solid rgba(255,107,53,0.3); }
        .tag-n { background: rgba(5,217,232,0.2); color: var(--sp-green); border: 1px solid rgba(5,217,232,0.3); }

        .card-name { font-weight: 700; font-size: 1.05rem; margin-bottom: 10px; line-height: 1.4; }
        .card-desc { font-size: 0.8rem; opacity: 0.55; margin-bottom: 14px; line-height: 1.5; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-clamp: 2; -webkit-box-orient: vertical; }

        .progress-wrap { margin-bottom: 8px; }
        .progress-header { display: flex; justify-content: space-between; font-size: 0.6rem; opacity: 0.7; margin-bottom: 4px; }
        .progress-bar { height: 5px; background: rgba(255,255,255,0.06); border-radius: 3px; overflow: hidden; }
        .progress-fill { height: 100%; border-radius: 3px; transition: width 0.5s ease; }

        .card-meta { font-size: 0.72rem; opacity: 0.5; margin-bottom: 14px; }
        .card-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 14px; }
        .card-tag { font-size: 0.6rem; padding: 3px 8px; background: rgba(5,217,232,0.08); border: 1px solid var(--border); border-radius: 10px; opacity: 0.75; }

        .card-actions { display: flex; gap: 6px; flex-wrap: wrap; }
        .card-action {
            flex: 1; min-width: 68px; padding: 8px; font-family: inherit;
            font-size: 0.7rem; font-weight: 700; letter-spacing: 1px;
            cursor: pointer; border-radius: 4px; transition: all 0.2s; border: 1px solid;
        }
        .ca-work { border-color: var(--sp-teal); color: var(--sp-teal); background: rgba(157,78,221,0.05); }
        .ca-work:hover { background: rgba(157,78,221,0.15); box-shadow: 0 0 15px rgba(157,78,221,0.2); }
        .ca-work.active { background: rgba(157,78,221,0.2); }
        .ca-plus { border-color: var(--sp-blue); color: var(--sp-blue); background: rgba(58,143,255,0.05); }
        .ca-plus:hover { background: rgba(58,143,255,0.15); }
        .ca-minus { border-color: rgba(255,255,255,0.2); color: var(--text-dim); background: rgba(255,255,255,0.03); }
        .ca-minus:hover { background: rgba(255,255,255,0.08); }
        .ca-done { border-color: var(--sp-lime); color: var(--sp-lime); background: rgba(255,32,121,0.05); }
        .ca-done:hover { background: rgba(255,32,121,0.15); box-shadow: 0 0 15px rgba(255,32,121,0.2); }

        /* ====== KANBAN ====== */
        .kanban-wrap { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; min-height: 400px; }
        .kanban-col { background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
        .kanban-col-header { font-size: 0.65rem; font-weight: 700; letter-spacing: 3px; margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .kanban-count { font-size: 0.7rem; background: rgba(5,217,232,0.1); border: 1px solid var(--border); padding: 2px 8px; border-radius: 10px; }
        .kanban-card { background: var(--panel); border: 1px solid var(--border); border-radius: 7px; padding: 12px; margin-bottom: 10px; cursor: pointer; font-size: 0.7rem; transition: all 0.2s; }
        .kanban-card:hover { border-color: var(--border-bright); transform: translateX(4px); }

        /* ====== STATS ====== */
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 24px; }
        .stat-card {
            background: var(--panel); border: 1px solid var(--border);
            border-radius: 10px; padding: 18px; position: relative; overflow: hidden;
        }
        .stat-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; }
        .stat-card.c-green::before { background: linear-gradient(90deg, var(--sp-green), var(--sp-lime)); }
        .stat-card.c-gold::before { background: linear-gradient(90deg, var(--sp-gold), var(--sp-orange)); }
        .stat-card.c-red::before { background: linear-gradient(90deg, var(--sp-red), var(--sp-purple)); }
        .stat-card.c-blue::before { background: linear-gradient(90deg, var(--sp-blue), var(--sp-teal)); }
        .stat-val { font-family: 'Orbitron', sans-serif; font-size: 2.6rem; font-weight: 900; display: block; margin-bottom: 4px; }
        .stat-card.c-green .stat-val { color: var(--sp-green); }
        .stat-card.c-gold .stat-val { color: var(--sp-gold); }
        .stat-card.c-red .stat-val { color: var(--sp-red); }
        .stat-card.c-blue .stat-val { color: var(--sp-blue); }
        .stat-lbl { font-size: 0.55rem; letter-spacing: 2px; opacity: 0.6; }

        /* WEEKLY CHART */
        .weekly-chart { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 20px; }
        .chart-title { font-size: 0.65rem; letter-spacing: 3px; opacity: 0.7; margin-bottom: 16px; font-weight: 700; }
        .bar-chart { display: flex; align-items: flex-end; gap: 8px; height: 80px; }
        .bar-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; height: 100%; }
        .bar { width: 100%; background: rgba(5,217,232,0.1); border: 1px solid var(--border); border-radius: 3px 3px 0 0; transition: height 0.6s ease; position: relative; overflow: hidden; cursor: pointer; min-height: 4px; }
        .bar-fill { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(180deg, var(--sp-lime), var(--sp-green)); border-radius: 3px 3px 0 0; transition: height 0.8s cubic-bezier(0.2,0.8,0.2,1); }
        .bar-val { font-size: 0.55rem; opacity: 0.7; }
        .bar-day { font-size: 0.5rem; opacity: 0.5; letter-spacing: 1px; }

        /* HEATMAP */
        .heatmap-wrap { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 20px; }
        .heatmap-grid { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 12px; }
        .heat-cell { width: 16px; height: 16px; border-radius: 3px; cursor: pointer; transition: all 0.2s; }
        .heat-cell:hover { transform: scale(1.3); z-index: 2; position: relative; }

        /* ACHIEVEMENTS */
        .achievements-wrap { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 20px; }
        .achievements-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; margin-top: 14px; }
        .achievement {
            padding: 14px; border: 1px solid var(--border); border-radius: 8px;
            text-align: center; transition: all 0.3s; opacity: 0.4; filter: grayscale(0.8);
        }
        .achievement.unlocked { opacity: 1; filter: none; border-color: var(--sp-gold); background: rgba(255,196,0,0.05); box-shadow: 0 0 15px rgba(255,196,0,0.15); }
        .ach-icon { font-size: 2rem; display: block; margin-bottom: 6px; }
        .ach-name { font-size: 0.6rem; font-weight: 700; letter-spacing: 1px; margin-bottom: 3px; }
        .ach-desc { font-size: 0.5rem; opacity: 0.6; }

        /* MOOD TRACKER */
        .mood-wrap { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 20px; }
        .mood-grid { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
        .mood-btn {
            padding: 10px 16px; font-family: inherit; font-size: 1.2rem;
            cursor: pointer; border-radius: 8px; border: 2px solid transparent;
            background: rgba(255,255,255,0.04); transition: all 0.2s;
        }
        .mood-btn:hover { transform: scale(1.15); }
        .mood-btn.selected { border-color: var(--sp-gold); background: rgba(255,196,0,0.1); box-shadow: 0 0 15px rgba(255,196,0,0.2); transform: scale(1.1); }
        .mood-history { display: flex; gap: 6px; margin-top: 14px; flex-wrap: wrap; }
        .mood-dot { font-size: 1.1rem; position: relative; cursor: default; }
        .mood-dot::after { content: attr(data-date); position: absolute; bottom: 120%; left: 50%; transform: translateX(-50%); font-size: 0.5rem; background: var(--bg2); padding: 3px 6px; border-radius: 3px; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity 0.2s; border: 1px solid var(--border); }
        .mood-dot:hover::after { opacity: 1; }

        /* JOURNAL */
        .journal-wrap { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 20px; }
        .journal-date-nav { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; }
        .journal-date-nav input { flex: 1; padding: 7px 10px; background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: 5px; color: var(--text); font-family: inherit; font-size: 0.7rem; }
        .journal-date-nav input:focus { outline: none; border-color: var(--sp-green); }
        #journal-text {
            width: 100%; min-height: 120px; padding: 12px;
            background: rgba(255,255,255,0.03); border: 1px solid var(--border);
            border-radius: 6px; color: var(--text); font-family: inherit; font-size: 0.75rem;
            line-height: 1.7; resize: vertical; transition: border-color 0.2s;
        }
        #journal-text:focus { outline: none; border-color: var(--sp-green); }
        .journal-btns { display: flex; gap: 8px; margin-top: 10px; }
        .j-btn { flex: 1; padding: 9px; font-family: inherit; font-size: 0.65rem; font-weight: 700; letter-spacing: 1px; cursor: pointer; border-radius: 5px; transition: all 0.2s; }
        .j-save { background: rgba(5,217,232,0.15); border: 1px solid var(--sp-green); color: var(--sp-green); }
        .j-save:hover { background: rgba(5,217,232,0.3); box-shadow: var(--glow-green); }
        .j-clear { background: rgba(255,255,255,0.04); border: 1px solid var(--border); color: var(--text-dim); }

        /* ====== ROUTINES ====== */
        .routine-wrap { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
        .routine-card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 18px; }
        .routine-title { font-size: 0.8rem; font-weight: 700; letter-spacing: 2px; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; color: var(--sp-lime); }
        .routine-progress-circle { font-size: 0.6rem; opacity: 0.7; margin-left: auto; }
        .routine-add { display: flex; gap: 8px; margin-bottom: 10px; }
        .routine-add input { flex: 1; padding: 7px; background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: 5px; color: var(--text); font-family: inherit; font-size: 0.7rem; }
        .routine-add input:focus { outline: none; border-color: var(--sp-green); }
        .routine-add button { padding: 7px 14px; background: rgba(5,217,232,0.15); border: 1px solid var(--sp-green); color: var(--sp-green); font-family: inherit; font-size: 0.8rem; cursor: pointer; border-radius: 5px; }
        .routine-list { list-style: none; }
        .routine-item { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.04); font-size: 0.7rem; }
        .routine-item:last-child { border-bottom: none; }
        .routine-check { cursor: pointer; width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--sp-green); display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.2s; }
        .routine-check.done { background: var(--sp-green); }
        .routine-item-text { flex: 1; cursor: pointer; transition: all 0.2s; }
        .routine-item-text.done { text-decoration: line-through; opacity: 0.4; }
        .routine-del { background: none; border: none; color: var(--sp-red); cursor: pointer; opacity: 0.4; font-size: 0.8rem; transition: opacity 0.2s; }
        .routine-del:hover { opacity: 1; }

        /* ====== MODALS ====== */
        .overlay {
            position: fixed; inset: 0; z-index: 9000;
            display: none; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(16px);
        }
        .overlay.show { display: flex; }
        .modal {
            background: rgba(14,6,30,0.98);
            border: 1px solid var(--border-bright);
            border-radius: 14px; padding: 32px;
            width: 90%; max-width: 480px;
            max-height: 90vh; overflow-y: auto;
            box-shadow: 0 0 60px rgba(5,217,232,0.2), inset 0 0 40px rgba(5,217,232,0.03);
            animation: modalIn 0.35s cubic-bezier(0.2,0.8,0.2,1);
        }
        .modal.wide { max-width: 700px; }
        @keyframes modalIn { from{opacity:0;transform:translateY(-30px) scale(0.95)} to{opacity:1;transform:none} }
        .modal-title { font-family: 'Orbitron', sans-serif; font-size: 1rem; font-weight: 700; color: var(--sp-lime); letter-spacing: 2px; margin-bottom: 24px; text-shadow: 0 0 15px var(--sp-lime); }
        .form-group { margin-bottom: 14px; }
        .form-label { font-size: 0.55rem; letter-spacing: 3px; opacity: 0.6; margin-bottom: 6px; display: block; font-weight: 700; }
        .form-input, .form-select, .form-textarea {
            width: 100%; padding: 10px 12px;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border); border-radius: 6px;
            color: var(--text); font-family: inherit; font-size: 0.8rem;
            transition: border-color 0.2s;
        }
        .form-input:focus, .form-select:focus, .form-textarea:focus { outline: none; border-color: var(--sp-green); background: rgba(5,217,232,0.05); }
        .form-textarea { min-height: 80px; resize: vertical; line-height: 1.6; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .form-select option { background: var(--bg2); }
        .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
        .mb-save { flex: 1; padding: 12px; font-family: inherit; font-size: 0.75rem; font-weight: 700; letter-spacing: 2px; cursor: pointer; border-radius: 7px; background: linear-gradient(135deg, var(--sp-green), var(--sp-lime)); border: none; color: var(--bg); transition: all 0.3s; }
        .mb-save:hover { transform: translateY(-2px); box-shadow: 0 4px 25px rgba(5,217,232,0.4); }
        .mb-cancel { padding: 12px 20px; font-family: inherit; font-size: 0.7rem; letter-spacing: 1px; cursor: pointer; border-radius: 7px; background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--text-dim); }
        .mb-cancel:hover { border-color: var(--sp-red); color: var(--sp-red); }

        /* EMOJI GRID */
        .emoji-palette { display: grid; grid-template-columns: repeat(8,1fr); gap: 6px; padding: 10px; background: rgba(255,255,255,0.03); border-radius: 7px; border: 1px solid var(--border); margin-bottom: 14px; }
        .ep-item { font-size: 1.1rem; cursor: pointer; text-align: center; padding: 5px; border-radius: 4px; transition: all 0.15s; }
        .ep-item:hover { background: rgba(5,217,232,0.1); transform: scale(1.2); }

        /* REVIEW MODAL */
        .review-modal-content { }
        .review-title { font-family: 'Orbitron', sans-serif; font-size: 1.1rem; font-weight: 700; margin-bottom: 16px; line-height: 1.4; }
        .review-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 18px; }
        .review-meta-item { padding: 10px; background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 6px; }
        .review-meta-label { font-size: 0.5rem; letter-spacing: 2px; opacity: 0.5; margin-bottom: 4px; font-weight: 700; }
        .review-meta-val { font-size: 0.75rem; font-weight: 700; }
        .review-desc { font-size: 0.75rem; opacity: 0.7; line-height: 1.7; padding: 14px; background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 6px; margin-bottom: 18px; }

        /* NOTIFICATIONS — semua notifikasi (biasa & AI) digabung jadi satu
           tumpukan di pojok kiri bawah lewat #notif-stack-area supaya tidak
           saling tumpang tindih meski muncul dari dua sumber berbeda. */
        #notif-stack-area {
            position: fixed; bottom: 20px; right: 20px; z-index: 99999;
            display: flex; flex-direction: column-reverse; gap: 8px;
            pointer-events: none; max-width: 350px;
        }
        #notif-area { display: flex; flex-direction: column-reverse; gap: 8px; }
        .notif {
            padding: 12px 18px; border-left: 3px solid; border-radius: 6px;
            backdrop-filter: blur(20px); font-size: 0.7rem; font-weight: 700; letter-spacing: 0.5px;
            animation: notifIn 0.3s ease, notifOut 0.3s 2.7s ease forwards;
            background: rgba(14,6,30,0.95); max-width: 320px;
        }
        .notif-green { border-color: var(--sp-green); color: var(--sp-green); box-shadow: 0 4px 20px rgba(5,217,232,0.2); }
        .notif-gold { border-color: var(--sp-gold); color: var(--sp-gold); }
        .notif-red { border-color: var(--sp-red); color: var(--sp-red); }
        @keyframes notifIn { from{opacity:0;transform:translateX(80px)} to{opacity:1;transform:none} }
        @keyframes notifOut { to{opacity:0;transform:translateX(80px)} }

        #ai-notif-area { display: flex; flex-direction: column-reverse; gap: 8px; }
        .ai-notif {
            padding: 14px 20px; border-left: 4px solid var(--sp-gold); border-right: 1px solid var(--sp-gold);
            background: rgba(14,6,30,0.95); backdrop-filter: blur(20px);
            font-size: 0.75rem; font-weight: 900; color: var(--sp-gold); letter-spacing: 1px;
            animation: aiIn 0.4s cubic-bezier(0.2,0.8,0.2,1), notifOut 0.4s 4.6s ease forwards;
            max-width: 350px;
        }
        .ai-notif.critical { border-color: var(--sp-red); color: var(--sp-red); box-shadow: 0 4px 30px rgba(255,8,68,0.3); }
        @keyframes aiIn { from{opacity:0;transform:translateX(80px)} to{opacity:1;transform:none} }

        /* ACHIEVEMENT POPUP */
        .ach-popup {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%) scale(0);
            z-index: 99999; text-align: center;
            background: rgba(14,6,30,0.98); border: 2px solid var(--sp-gold);
            border-radius: 14px; padding: 30px 40px;
            box-shadow: 0 0 80px rgba(255,196,0,0.4);
            animation: achPop 0.5s cubic-bezier(0.2,0.8,0.2,1) forwards;
            pointer-events: none;
        }
        @keyframes achPop {
            0%{transform:translate(-50%,-50%) scale(0); opacity:0}
            60%{transform:translate(-50%,-50%) scale(1.08)}
            100%{transform:translate(-50%,-50%) scale(1); opacity:1}
        }
        .ach-popup-icon { font-size: 3rem; display: block; margin-bottom: 10px; }
        .ach-popup-title { font-family: 'Orbitron', sans-serif; font-size: 0.7rem; letter-spacing: 4px; color: var(--sp-gold); }
        .ach-popup-name { font-size: 1.1rem; font-weight: 700; margin-top: 6px; }

        /* PARTICLE BURST */
        .particle { position: fixed; pointer-events: none; z-index: 99998; font-size: 1.5rem; animation: particleFly 1s ease-out forwards; }
        @keyframes particleFly { 0%{opacity:1;transform:translate(0,0) scale(1)} 100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(0)} }

        /* LEAF BG */
        .leaf { position: fixed; pointer-events: none; z-index: 0; font-size: 1.3rem; opacity: 0.06; color: var(--sp-green); text-shadow: 0 0 12px var(--sp-green); animation: leafDrift linear infinite; }
        @keyframes leafDrift { 0%{transform:translateY(110vh) rotate(0deg) translateX(0); opacity:0} 10%{opacity:0.08} 90%{opacity:0.05} 100%{transform:translateY(-20px) rotate(360deg) translateX(80px); opacity:0} }

        /* LOG PANEL */
        .log-panel {
            position: fixed; right: -340px; top: 0; height: 100vh; width: 320px;
            background: rgba(11,5,26,0.97); border-left: 1px solid var(--border);
            z-index: 200; display: flex; flex-direction: column;
            transition: right 0.4s cubic-bezier(0.2,0.8,0.2,1);
        }
        .log-panel.open { right: 0; }
        .log-header { padding: 20px; border-bottom: 1px solid var(--border); font-size: 0.7rem; font-weight: 700; letter-spacing: 3px; color: var(--sp-blue); display: flex; justify-content: space-between; align-items: center; }
        .log-list { flex: 1; overflow-y: auto; padding: 10px; }
        .log-item { padding: 8px 10px; border-bottom: 1px solid rgba(255,255,255,0.04); font-size: 0.65rem; display: flex; justify-content: space-between; gap: 10px; }
        .log-time { opacity: 0.4; flex-shrink: 0; }
        .log-footer { padding: 12px; border-top: 1px solid var(--border); display: flex; gap: 8px; }
        .log-btn { flex: 1; padding: 8px; font-family: inherit; font-size: 0.65rem; letter-spacing: 1px; cursor: pointer; border-radius: 5px; }
        .lb-clear { background: rgba(255,8,68,0.1); border: 1px solid var(--sp-red); color: var(--sp-red); }
        .lb-close { background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--text-dim); }

        /* LOG TRIGGER — sekarang jadi tombol ikon di topbar (bukan lagi mengambang) */
        #log-trigger {
            position: relative; width: 40px; height: 40px; padding: 0;
            border-radius: 50%; background: rgba(11,5,26,0.9);
            border: 1px solid var(--border-bright); color: var(--sp-green);
            font-size: 1.1rem; cursor: pointer;
            box-shadow: 0 0 14px rgba(5,217,232,0.2);
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        #log-trigger:hover { box-shadow: 0 0 24px rgba(5,217,232,0.4); transform: scale(1.08); }
        .log-badge {
            position: absolute; top: -4px; right: -4px;
            min-width: 16px; height: 16px; padding: 0 4px;
            border-radius: 9px; background: var(--sp-red); color: #fff;
            font-family: 'JetBrains Mono', monospace; font-size: 0.55rem; font-weight: 700;
            display: none; align-items: center; justify-content: center;
            box-shadow: 0 0 8px rgba(255,8,68,0.6); line-height: 1;
        }
        .log-badge.show { display: flex; }

        /* REST MODE */
        #rest-overlay {
            position: fixed; inset: 0; z-index: 999999;
            background: rgba(4,1,12,0.92);
            display: flex; align-items: center; justify-content: center;
            backdrop-filter: blur(30px);
        }
        .rest-box { text-align: center; padding: 50px; border: 1px solid var(--sp-teal); background: rgba(14,6,30,0.98); border-radius: 16px; box-shadow: 0 0 80px rgba(157,78,221,0.3); max-width: 400px; width: 90%; }
        #rest-timer { font-family: 'Orbitron', sans-serif; font-size: 4rem; font-weight: 900; color: var(--sp-teal); text-shadow: 0 0 40px var(--sp-teal); letter-spacing: 6px; margin: 20px 0; }
        .rest-label { font-size: 0.65rem; letter-spacing: 4px; opacity: 0.6; }
        .rest-exit { margin-top: 24px; padding: 12px 30px; font-family: inherit; font-size: 0.7rem; letter-spacing: 2px; cursor: pointer; border: 1px solid var(--sp-teal); background: transparent; color: var(--sp-teal); border-radius: 6px; transition: all 0.3s; }
        .rest-exit:hover { background: rgba(157,78,221,0.1); }

        /* SCROLLBAR */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--sp-green); border-radius: 2px; opacity: 0.5; }

        /* SWIPE-TO-SCROLL (drag/geser, bukan scroll biasa) */
        .swipe-scroll { cursor: grab; scroll-behavior: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y; }
        .swipe-scroll.dragging { cursor: grabbing; }
        .swipe-scroll.actually-dragging { user-select: none; -webkit-user-select: none; }
        .swipe-scroll.actually-dragging * { pointer-events: none; }

        /* MISC */
        h3 { font-family: 'Orbitron', sans-serif; font-size: 0.9rem; font-weight: 700; letter-spacing: 3px; color: var(--sp-lime); margin-bottom: 16px; text-shadow: 0 0 10px var(--sp-lime); }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .section-header h3 { margin: 0; }
        .section-action { font-size: 0.6rem; letter-spacing: 2px; opacity: 0.5; cursor: pointer; transition: opacity 0.2s; }
        .section-action:hover { opacity: 1; color: var(--sp-green); }
        .empty-state { text-align: center; padding: 60px 20px; opacity: 0.35; }
        .empty-icon { font-size: 3rem; display: block; margin-bottom: 14px; }
        .empty-text { font-size: 0.7rem; letter-spacing: 2px; }
        .filter-bar { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
        .filter-chip { padding: 5px 14px; font-family: inherit; font-size: 0.6rem; letter-spacing: 1px; cursor: pointer; border-radius: 20px; border: 1px solid var(--border); background: transparent; color: var(--text-dim); transition: all 0.2s; }
        .filter-chip.active { border-color: var(--sp-green); color: var(--sp-green); background: rgba(5,217,232,0.1); }

        /* ====== PRESS / RIPPLE TRANSITIONS ====== */
        button, .nav-btn, .action-btn, .card-action, .mood-btn, .view-btn,
        .filter-chip, .ep-item, .routine-check, .routine-del, .heat-cell, .kanban-card,
        .task-card, .achievement, .ambient-btn, .mb-save, .mb-cancel, .j-btn, .log-btn,
        #log-trigger, .rest-exit, .streak-orb, .bar {
            transition: transform 0.15s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.2s ease, background 0.2s ease, border-color 0.2s ease, opacity 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }
        button:active, .action-btn:active, .card-action:active,
        .mood-btn:active, .view-btn:active, .filter-chip:active, .ep-item:active,
        .routine-check:active, .routine-del:active, .heat-cell:active, .kanban-card:active,
        .achievement:active, .ambient-btn:active, .mb-save:active, .mb-cancel:active,
        .j-btn:active, .log-btn:active, #log-trigger:active, .rest-exit:active {
            transform: scale(0.92);
        }
        .task-card:active { transform: translateY(-2px) scale(0.98); }
        .nav-btn:active { transform: scale(0.96); }
        .streak-orb:active { transform: scale(0.88); }
        .mood-btn:active { transform: scale(1.02); }

        /* ====== FUTURISTIC BUTTON HOVER SWEEP ====== */
        button, .nav-btn, .action-btn, .card-action, .view-btn, .filter-chip,
        .mood-btn, .ambient-btn, .j-btn, .log-btn, #log-trigger, .rest-exit,
        .mb-save, .mb-cancel, .routine-add button {
            position: relative;
            overflow: hidden;
            isolation: isolate;
        }
        button::before, .nav-btn::before, .action-btn::before, .card-action::before,
        .view-btn::before, .filter-chip::before, .mood-btn::before, .ambient-btn::before,
        .j-btn::before, .log-btn::before, #log-trigger::before, .rest-exit::before,
        .mb-save::before, .mb-cancel::before, .routine-add button::before {
            content: '';
            position: absolute;
            top: 0; left: -60%;
            width: 40%; height: 100%;
            background: linear-gradient(120deg, transparent, rgba(255,255,255,0.45), transparent);
            transform: skewX(-25deg);
            pointer-events: none;
            z-index: 1;
            transition: left 0.55s cubic-bezier(0.2,0.8,0.2,1);
        }
        button:hover::before, .nav-btn:hover::before, .action-btn:hover::before,
        .card-action:hover::before, .view-btn:hover::before, .filter-chip:hover::before,
        .mood-btn:hover::before, .ambient-btn:hover::before, .j-btn:hover::before,
        .log-btn:hover::before, #log-trigger:hover::before, .rest-exit:hover::before,
        .mb-save:hover::before, .mb-cancel:hover::before, .routine-add button:hover::before {
            left: 140%;
        }
        button:hover, .action-btn:hover, .card-action:hover,
        .filter-chip:hover, .ambient-btn:hover,
        .j-btn:hover, .log-btn:hover, #log-trigger:hover, .rest-exit:hover,
        .mb-save:hover, .mb-cancel:hover, .routine-add button:hover {
            transform: translateY(-2px);
            filter: brightness(1.12);
        }
        .filter-chip:hover {
            transform: translateY(-1px);
        }

        /* Ripple effect on press */
        .ripple-el { position: relative; overflow: hidden; }
        .ripple-span {
            position: absolute; border-radius: 50%; pointer-events: none;

<script>
// ===================== SAFE + DURABLE STORAGE =====================
// storage.get()/storage.set() are SYNCHRONOUS on purpose - the rest of this
// app (2000+ lines) reads/writes storage inline without awaiting anything,
// so they're backed by a fast in-memory cache (mirrored to localStorage
// when available) that responds instantly.
//
// On top of that, if this page is running inside a Claude artifact,
// window.storage (async, durable, survives closing the tab/reopening the
// artifact later) is available. storage.hydrate() pulls everything from
// that durable backend into the fast cache once at startup, and every
// storage.set() also fires an async write-through to it in the background -
// so data keeps persisting for real instead of disappearing on refresh.
const storage = (function () {
    const hasDurable = typeof window !== 'undefined' && window.storage && typeof window.storage.get === 'function';
    let localOk = true;
    try {
        const t = '__sp_storage_test__';
        window.localStorage.setItem(t, '1');
        window.localStorage.removeItem(t);
    } catch (e) { localOk = false; }
    const mem = {};

    function rawGet(key) {
        if (localOk) {
            try { return window.localStorage.getItem(key); }
            catch (e) { localOk = false; }
        }
        return Object.prototype.hasOwnProperty.call(mem, key) ? mem[key] : null;
    }
    function rawSet(key, value) {
        if (localOk) {
            try { window.localStorage.setItem(key, value); return; }
            catch (e) { localOk = false; }
        }
        mem[key] = value;
    }

    return {
        get: rawGet,
        set(key, value) {
            rawGet; // no-op reference to keep linters happy
            rawSet(key, value);
            if (hasDurable) {
                window.storage.set(key, value, false).catch(() => {});
            }
        },
        // Pulls every known key from the durable backend into the fast cache,
        // then invokes onReady() so the caller can re-read state and re-render.
        hydrate(keys, onReady) {
            if (!hasDurable) { onReady(); return; }
            Promise.all(keys.map(key =>
                window.storage.get(key, false)
                    .then(res => { if (res && res.value != null) rawSet(key, res.value); })
                    .catch(() => {}) // key just doesn't exist yet - keep local value
            )).then(onReady).catch(onReady);
        },
        isAvailable() { return hasDurable || localOk; },
        usingDurable() { return hasDurable; }
    };
})();
const SP_STORAGE_KEYS = ['sp_tasks_v5','sp_logs_v5','sp_routines_v5','sp_moods_v5','sp_journal_v5',
    'sp_achievements_v5','sp_streak_v5','sp_consecutive_v5','sp_task_create_map','sp_idle_warned',
    'sp_streak_history','sp_routine_templates','sp_theme','sp_last_active','sp_hud_size'];

// ===================== CORE STATE =====================
let db = JSON.parse(storage.get('sp_tasks_v5')) || [];
let logs = JSON.parse(storage.get('sp_logs_v5')) || [];
let routineData = JSON.parse(storage.get('sp_routines_v5')) || { pagi:[], siang:[], sore:[], malam:[] };
let moodHistory = JSON.parse(storage.get('sp_moods_v5')) || {};
let journalData = JSON.parse(storage.get('sp_journal_v5')) || {};
let achievements = JSON.parse(storage.get('sp_achievements_v5')) || {};
let finishCount = parseInt(storage.get('sp_streak_v5')) || 0;
let currentTab = 'todo';
let currentView = 'grid';
let ambientCtx = null, ambientPlaying = false, ambientNodes = {};
let consecutiveDone = parseInt(storage.get('sp_consecutive_v5')) || 0;
let restActive = false, restTimer = null, restCountdown = null, restEnd = 0;
let taskCreateMap = JSON.parse(storage.get('sp_task_create_map')) || {};
let idleWarned = JSON.parse(storage.get('sp_idle_warned')) || {};
let filterPrio = 'all';

// ===================== AUDIO =====================
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playTone(freq, type='sine', dur=0.1, vol=0.08) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + dur);
}
function playClick() { playTone(800, 'sine', 0.07, 0.05); }
function playSuccess() {
    [600,800,1000,1200].forEach((f,i) => setTimeout(()=>playTone(f,'triangle',0.15,0.07),i*60));
}
function playDelete() { playTone(300,'sawtooth',0.15,0.07); }
function playAchievement() {
    [400,600,800,1000,1200,1600].forEach((f,i) => setTimeout(()=>playTone(f,'triangle',0.25,0.1),i*80));
}

// ===================== PRESS RIPPLE EFFECT =====================
(function initRipple() {
    const selector = [
        'button', '.nav-btn', '.action-btn', '.card-action', '.mood-btn',
        '.view-btn', '.filter-chip', '.ep-item', '.routine-check', '.routine-del',
        '.heat-cell', '.kanban-card', '.task-card', '.achievement', '.ambient-btn',
        '.mb-save', '.mb-cancel', '.j-btn', '.log-btn', '#log-trigger', '.rest-exit'
    ].join(', ');
    document.addEventListener('pointerdown', (e) => {
        const el = e.target.closest(selector);
        if (!el) return;
        el.classList.add('ripple-el');
        const rect = el.getBoundingClientRect();
        const size = Math.max(rect.width, rect.height) * 1.2;
        const span = document.createElement('span');
        span.className = 'ripple-span';
        span.style.width = span.style.height = size + 'px';
        span.style.left = (e.clientX - rect.left - size / 2) + 'px';
        span.style.top = (e.clientY - rect.top - size / 2) + 'px';
        el.appendChild(span);
        setTimeout(() => span.remove(), 650);
    }, { passive: true });
})();

function toggleAmbient() {
    if (!ambientCtx) ambientCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (ambientPlaying) {
        Object.values(ambientNodes).forEach(n => { try{n.stop()}catch(e){} });
        ambientNodes = {}; ambientPlaying = false;
        document.getElementById('ambient-btn').classList.remove('playing');
        document.getElementById('ambient-btn').textContent = '🎵 AMBIENT SOUND';
    } else {
        // Forest ambient: noise + soft tones
        const bufSize = ambientCtx.sampleRate * 2;
        const buf = ambientCtx.createBuffer(1, bufSize, ambientCtx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < bufSize; i++) data[i] = (Math.random()*2-1) * 0.03;
        const noise = ambientCtx.createBufferSource();
        noise.buffer = buf; noise.loop = true;
        const filter = ambientCtx.createBiquadFilter();
        filter.type = 'lowpass'; filter.frequency.value = 400;
        const gainNode = ambientCtx.createGain(); gainNode.gain.value = 0.3;
        noise.connect(filter); filter.connect(gainNode); gainNode.connect(ambientCtx.destination);
        noise.start();
        // Soft drone
        [130, 196].forEach(freq => {
            const osc = ambientCtx.createOscillator();
            const g = ambientCtx.createGain(); g.gain.value = 0.025;
            osc.frequency.value = freq; osc.type = 'sine';
            osc.connect(g); g.connect(ambientCtx.destination);
            osc.start();
            ambientNodes['osc'+freq] = osc;
        });
        ambientNodes.noise = noise;
        ambientPlaying = true;
        document.getElementById('ambient-btn').classList.add('playing');
        document.getElementById('ambient-btn').textContent = '🔇 STOP AMBIENT';
    }
}

// ===================== CANVAS BG =====================
(function initCanvas() {
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    resize(); window.addEventListener('resize', resize);
    for (let i = 0; i < 60; i++) {
        particles.push({
            x: Math.random()*window.innerWidth, y: Math.random()*window.innerHeight,
            r: Math.random()*1.5+0.5, vx: (Math.random()-0.5)*0.3, vy: (Math.random()-0.5)*0.3,
            hue: Math.random() > 0.5 ? '5,217,232' : '157,78,221'
        });
    }
    function drawParticles() {
        ctx.clearRect(0,0,canvas.width,canvas.height);
        particles.forEach(p => {
            p.x += p.vx; p.y += p.vy;
            if (p.x < 0) p.x = canvas.width; if (p.x > canvas.width) p.x = 0;
            if (p.y < 0) p.y = canvas.height; if (p.y > canvas.height) p.y = 0;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
            ctx.fillStyle = `rgba(${p.hue},0.6)`;
            ctx.fill();
        });
        // Draw connections
        for (let i = 0; i < particles.length; i++) {
            for (let j = i+1; j < particles.length; j++) {
                const dx = particles[i].x - particles[j].x;
                const dy = particles[i].y - particles[j].y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                if (dist < 120) {
                    ctx.beginPath();
                    ctx.strokeStyle = `rgba(5,217,232,${0.08*(1-dist/120)})`;
                    ctx.lineWidth = 0.5;
                    ctx.moveTo(particles[i].x, particles[i].y);
                    ctx.lineTo(particles[j].x, particles[j].y);
                    ctx.stroke();
                }
            }
        }
        requestAnimationFrame(drawParticles);
    }
    drawParticles();
})();

// ===================== FLOATING GLYPHS =====================
(function createLeaves() {
    const container = document.getElementById('leaf-container');
    const types = ['⚡','◆','✦','▲','⬡'];
    for (let i = 0; i < 12; i++) {
        const el = document.createElement('div');
        el.className = 'leaf';
        el.textContent = types[Math.floor(Math.random()*types.length)];
        el.style.left = Math.random()*100 + '%';
        el.style.animationDelay = Math.random()*30 + 's';
        el.style.animationDuration = (20 + Math.random()*20) + 's';
        container.appendChild(el);
    }
})();

// ===================== CLOCK =====================
function updateClock() {
    const now = new Date();
    const h = String(now.getHours()).padStart(2,'0');
    const m = String(now.getMinutes()).padStart(2,'0');
    const s = String(now.getSeconds()).padStart(2,'0');
    document.getElementById('sb-time').textContent = `${h}:${m}:${s}`;
    const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    document.getElementById('sb-date').textContent = `${days[now.getDay()]}, ${String(now.getDate()).padStart(2,'0')} ${months[now.getMonth()]} ${now.getFullYear()}`;
    const hr = now.getHours();
    let period, color;
    if(hr < 5){period='🌙 MIDNIGHT';color='#9d4edd';}
    else if(hr < 11){period='🌅 MORNING';color='#ffc400';}
    else if(hr < 15){period='☀️ AFTERNOON';color='#ff2079';}
    else if(hr < 18){period='🌆 EVENING';color='#ff6b35';}
    else{period='🌃 NIGHT';color='#3a8fff';}
    const el = document.getElementById('sb-period');
    el.textContent = period; el.style.color = color;
}
setInterval(updateClock, 1000); updateClock();

// ===================== NOTIFICATIONS =====================

}

let unreadLogCount = 0;
function updateLogBadge() {
    const b = document.getElementById('log-badge');

function toggleLog() {
    const panel = document.getElementById('log-panel');

function clearLogs() { logs = []; storage.set('sp_logs_v5', JSON.stringify(logs)); renderLogs(); playClick(); }
function renderLogs() {
    const list = document.getElementById('log-list');
    list.innerHTML = logs.map(l => `<div class="log-item"><span>${l.msg}</span><span class="log-time">${l.time}</span></div>`).join('');

// ===================== ENERGY =====================
function updateEnergy() {
    const today = new Date().toISOString().split('T')[0];
    const done = db.filter(t => t.done && t.finishedDate === today).length;
    const pct = Math.min(done * 10, 100);
    document.getElementById('energy-fill').style.width = pct + '%';
    document.getElementById('e-done').textContent = `${done} done`;
    let lvl = 'NO ENERGY', color = '#666';
    if (done >= 10) { lvl = '⚡⚡ OVERDRIVE'; color = 'var(--sp-red)'; }
    else if (done >= 7) { lvl = '🔥 BLAZING'; color = 'var(--sp-orange)'; }
    else if (done >= 5) { lvl = '⚡ STRONG'; color = 'var(--sp-gold)'; }
    else if (done >= 3) { lvl = '💪 MODERATE'; color = 'var(--sp-lime)'; }
    else if (done >= 1) { lvl = '💧 WEAK'; color = 'var(--sp-blue)'; }
    const el = document.getElementById('e-level');
    el.textContent = lvl; el.style.color = color;
}

// ===================== STREAK =====================
function updateStreak() {
    const orb = document.getElementById('streak-orb');
    const status = document.getElementById('streak-status');
    orb.textContent = finishCount;
    orb.classList.remove('hot','fire');
    if (finishCount >= 5) { orb.classList.add('fire'); status.textContent = '🔥 OVERDRIVE!!'; status.style.color = 'var(--sp-red)'; }
    else if (finishCount >= 2) { orb.classList.add('hot'); status.textContent = '⚡ ACTIVE'; status.style.color = 'var(--sp-gold)'; }
    else { status.textContent = 'STANDBY'; status.style.color = 'var(--sp-green)'; }
    storage.set('sp_streak_v5', finishCount);
    saveDailyStreak();
}

function saveDailyStreak() {
    const today = new Date().toISOString().split('T')[0];
    let history = JSON.parse(storage.get('sp_streak_history')) || {};
    history[today] = finishCount;
    storage.set('sp_streak_history', JSON.stringify(history));
}

// Daily reset - called once after storage has finished hydrating (see INIT below)
function checkDailyReset() {
    const today = new Date().toISOString().split('T')[0];
    const last = storage.get('sp_last_active');
    if (last && last !== today) {
        finishCount = 0;
        consecutiveDone = 0;
        storage.set('sp_streak_v5', 0);
        storage.set('sp_consecutive_v5', 0);
        pushAiNotif('NEW DAY DETECTED. STREAKS RESET.', false);
    }
}

// ===================== BADGE COUNTS =====================
function updateBadges() {
    const todo = db.filter(t => !t.done && t.type === 'todo').length;
    const proj = db.filter(t => !t.done && t.type === 'project').length;

    document.getElementById('badge-project').textContent = proj;

    { id:'streak3', icon:'⚡', name:'LIGHTNING', desc:'Finish 3 tasks today', check: ()=> finishCount >= 3 },
    { id:'streak7', icon:'🔥', name:'INFERNO', desc:'Finish 7 tasks today', check: ()=> finishCount >= 7 },
    { id:'ten_tasks', icon:'💯', name:'CENTURION', desc:'Create 10 total tasks', check: ()=> db.length >= 10 },

];

function checkAchievements() {
    ACHIEVEMENTS_DEF.forEach(ach => {
        if (!achievements[ach.id] && ach.check && ach.check()) {
            achievements[ach.id] = true;
            storage.set('sp_achievements_v5', JSON.stringify(achievements));
            showAchievementPopup(ach);
        }
    });
    // Check all unlocked
    const allUnlocked = ACHIEVEMENTS_DEF.filter(a=>a.id !== 'solarpunk').every(a => achievements[a.id]);
    if (allUnlocked && !achievements.solarpunk) {
        achievements.solarpunk = true;
        storage.set('sp_achievements_v5', JSON.stringify(achievements));
        showAchievementPopup(ACHIEVEMENTS_DEF.find(a=>a.id==='solarpunk'));
    }
}

function showAchievementPopup(ach) {
    playAchievement();
    pushNotif(`🏆 ACHIEVEMENT UNLOCKED: ${ach.name}`, 'notif-gold');
    const popup = document.createElement('div');
    popup.className = 'ach-popup';
    popup.innerHTML = `<span class="ach-popup-icon">${ach.icon}</span><div class="ach-popup-title">ACHIEVEMENT UNLOCKED</div><div class="ach-popup-name">${ach.name}</div><div style="font-size:0.6rem;opacity:0.6;margin-top:6px;">${ach.desc}</div>`;
    document.body.appendChild(popup);
    setTimeout(() => popup.remove(), 3000);
}

// ===================== PARTICLE BURST =====================
function particleBurst(x, y) {
    const emojis = ['✨','⚡','⚡','💠','✦'];
    for (let i = 0; i < 8; i++) {
        const el = document.createElement('div');
        el.className = 'particle';
        el.textContent = emojis[Math.floor(Math.random()*emojis.length)];
        const angle = (Math.PI*2/8)*i;
        const dist = 80 + Math.random()*60;
        el.style.left = x + 'px'; el.style.top = y + 'px';
        el.style.setProperty('--dx', `${Math.cos(angle)*dist}px`);
        el.style.setProperty('--dy', `${Math.sin(angle)*dist}px`);
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 1000);
    }
}

// ===================== TASK CRUD =====================
function openModal(mode, taskId=null) {
    playClick();
    document.getElementById('in-id').value = '';
    document.getElementById('in-name').value = '';
    document.getElementById('in-prio').value = 'normal';
    document.getElementById('in-type').value = currentTab === 'project' ? 'project' : 'todo';
    document.getElementById('in-date').value = '';
    document.getElementById('in-time').value = '';
    document.getElementById('in-tags').value = '';
    document.getElementById('in-desc').value = '';
    if (mode === 'edit' && taskId) {
        const t = db.find(x => x.id === taskId);
        if (!t) return;
        document.getElementById('modal-title').textContent = '✏️ EDIT TASK';
        document.getElementById('in-id').value = t.id;
        document.getElementById('in-name').value = t.name;
        document.getElementById('in-prio').value = t.prio;
        document.getElementById('in-type').value = t.type;
        document.getElementById('in-date').value = t.date || '';
        document.getElementById('in-time').value = t.time || '';
        document.getElementById('in-tags').value = (t.tags || []).join(', ');
        document.getElementById('in-desc').value = t.desc || '';
    } else {
        document.getElementById('modal-title').textContent = '📝 CREATE TASK';
    }
    document.getElementById('modal-task').classList.add('show');
}

function saveTask() {
    playClick();
    const idVal = document.getElementById('in-id').value;
    const name = document.getElementById('in-name').value.trim();
    if (!name) { document.getElementById('in-name').style.borderColor = 'var(--sp-red)'; return; }
    document.getElementById('in-name').style.borderColor = '';
    const tags = document.getElementById('in-tags').value.split(',').map(t=>t.trim()).filter(Boolean);
    if (idVal) {
        const idx = db.findIndex(t => t.id == idVal);
        if (idx >= 0) {
            Object.assign(db[idx], { name, prio: document.getElementById('in-prio').value, type: document.getElementById('in-type').value, date: document.getElementById('in-date').value, time: document.getElementById('in-time').value, tags, desc: document.getElementById('in-desc').value });
            pushNotif(`✏️ UPDATED: ${name}`, 'notif-gold');
        }
    } else {
        const task = { id: Date.now(), createdDate: new Date().toISOString().split('T')[0], finishedDate: null, name, prio: document.getElementById('in-prio').value, type: document.getElementById('in-type').value, date: document.getElementById('in-date').value, time: document.getElementById('in-time').value, tags, desc: document.getElementById('in-desc').value, progress: 0, done: false, isWorking: false };
        db.push(task);
        taskCreateMap[task.id] = Date.now();
        storage.set('sp_task_create_map', JSON.stringify(taskCreateMap));
        pushNotif(`◆ CREATED: ${name}`, 'notif-green');
    }
    sync();
    checkAchievements();
}

function markDone(id) {
    const t = db.find(t => t.id === id);
    if (!t || t.done) return;
    const created = taskCreateMap[id];
    t.done = true; t.finishedDate = new Date().toISOString().split('T')[0]; t.progress = 100;
    finishCount++; updateStreak(); updateEnergy();
    const today = t.finishedDate;
    storage.set('sp_last_active', today);
    consecutiveDone++;
    storage.set('sp_consecutive_v5', consecutiveDone);
    if (created && Date.now() - created < 5000) {
        pushAiNotif('ANOMALY: TASK COMPLETED IN UNDER 5 SECONDS', true);
    }
    delete taskCreateMap[id];
    storage.set('sp_task_create_map', JSON.stringify(taskCreateMap));
    // Particle burst at task card
    const card = document.getElementById(`card-${id}`);
    if (card) {
        const rect = card.getBoundingClientRect();
        particleBurst(rect.left + rect.width/2, rect.top + rect.height/2);
    }
    pushNotif(`✅ COMPLETE: ${t.name}`, 'notif-green');
    playSuccess();
    if (consecutiveDone >= 5) {
        consecutiveDone = 0;
        storage.set('sp_consecutive_v5', 0);
        setTimeout(showRestPrompt, 500);
    }
    sync(); checkAchievements();
}

function updateProgress(id, delta) {
    const t = db.find(t => t.id === id);
    if (!t) return;
    let np = Math.max(0, Math.min(100, (t.progress||0) + delta));
    if (np === 100 && !t.done) { markDone(id); return; }
    if (np < 100 && t.done) { t.done = false; t.finishedDate = null; if(finishCount>0){finishCount--;updateStreak();} }
    t.progress = np;
    playClick();
    sync();
}

function toggleWork(id) {
    db.forEach(t => t.isWorking = false);
    const t = db.find(t => t.id === id);
    if (t) { t.isWorking = !t.done && !false; /* will toggle */ }
    // Re-find since we set all false
    const t2 = db.find(t => t.id === id);
    if (t2) t2.isWorking = !t2.isWorking;
    playClick(); sync();
}

function deleteTask(id) {
    const t = db.find(t=>t.id===id);
    if (!t) return;
    playDelete();
    if (!t.done) { finishCount = Math.max(0, finishCount-1); updateStreak(); pushAiNotif('STREAK DISRUPTED. TASK PURGED.', true); }
    db = db.filter(t=>t.id!==id);
    pushNotif(`🗑️ DELETED: ${t.name}`, 'notif-red');
    sync();
}

function sync() {
    storage.set('sp_tasks_v5', JSON.stringify(db));
    updateBadges(); updateEnergy();
    closeModals(); render();
}

// ===================== RENDER =====================
function render() {
    const container = document.getElementById('content-area');
    container.innerHTML = '';
    container.classList.remove('content-fade');
    void container.offsetWidth; // restart animation
    container.classList.add('content-fade');

    const viewToggle = document.getElementById('view-toggle');
    const createBtn = document.getElementById('create-btn');
    const hidden = ['stats','mood','journal','achievements','routines','done'];
    createBtn.style.display = hidden.includes(currentTab) ? 'none' : '';
    viewToggle.style.display = (currentTab==='todo'||currentTab==='project') ? '' : 'none';

    if (currentTab === 'stats') { renderStats(container); return; }
    if (currentTab === 'mood') { renderMood(container); return; }
    if (currentTab === 'journal') { renderJournal(container); return; }
    if (currentTab === 'achievements') { renderAchievements(container); return; }
    if (currentTab === 'settings') { renderSettings(container); return; }
    if (currentTab === 'routines') { renderRoutines(container); return; }

    const filtered = db.filter(t => currentTab === 'done' ? t.done : (!t.done && t.type === currentTab));
    const afterFilter = filterPrio === 'all' ? filtered : filtered.filter(t => t.prio === filterPrio);

    // Filter bar
    if (currentTab !== 'done') {
        const fb = document.createElement('div');
        fb.className = 'filter-bar';
        fb.innerHTML = [
            ['all','⚡ ALL',''],['normal','🟢 NORMAL','normal'],
            ['penting','🟡 IMPORTANT','penting'],['sangat-penting','🔴 CRITICAL','sangat-penting']
        ].map(([v,l,p]) => `<button class="filter-chip${filterPrio===v?' active':''}" onclick="setFilter('${v}')">${l}</button>`).join('');
        container.appendChild(fb);
    }

    if (afterFilter.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty-state';
        empty.innerHTML = `<span class="empty-icon">◆</span><div class="empty-text">NO TASKS IN THIS SECTOR</div>`;
        container.appendChild(empty);
        return;
    }

    if (currentView === 'kanban' && currentTab !== 'done') {
        renderKanban(container, afterFilter);
    } else {
        const grid = document.createElement('div');
        grid.className = 'task-grid';
        afterFilter.forEach(t => grid.appendChild(makeTaskCard(t)));
        container.appendChild(grid);
    }
}

function setFilter(v) { filterPrio = v; playClick(); render(); }
function setView(v, btn) {
    currentView = v; playClick();
    document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
}

function makeTaskCard(t) {
    const card = document.createElement('div');
    const prioClass = t.prio === 'sangat-penting' ? 'p-sangat-penting' : (t.prio === 'penting' ? 'p-penting' : 'p-normal');
    const tagClass = t.prio === 'sangat-penting' ? 'tag-sp' : (t.prio === 'penting' ? 'tag-p' : 'tag-n');
    const tagLabel = t.prio === 'sangat-penting' ? 'CRITICAL' : (t.prio === 'penting' ? 'IMPORTANT' : 'NORMAL');
    card.className = `task-card ${prioClass} ${t.isWorking ? 'working' : ''}`;
    card.id = `card-${t.id}`;
    const prog = t.done ? 100 : (t.progress || 0);
    const barColor = prog === 100 ? 'var(--sp-lime)' : (t.isWorking ? 'var(--sp-teal)' : 'var(--sp-blue)');
    const tagsHtml = (t.tags||[]).length ? `<div class="card-tags">${t.tags.map(tg=>`<span class="card-tag">${tg}</span>`).join('')}</div>` : '';
    card.innerHTML = `
        <div onclick="reviewTask(${t.id})">
            <div class="card-prio-tag ${tagClass}">${tagLabel}</div>
            <div class="card-name">${t.name}</div>
            ${t.desc ? `<div class="card-desc">${t.desc}</div>` : ''}
            ${tagsHtml}
            <div class="progress-wrap">
                <div class="progress-header"><span>PROGRESS: ${prog}%</span><span style="color:${barColor}">${t.isWorking?'⚡ ACTIVE':t.done?'DONE':'PENDING'}</span></div>
                <div class="progress-bar"><div class="progress-fill" style="width:${prog}%; background:${barColor}; box-shadow:0 0 8px ${barColor};"></div></div>
            </div>
            <div class="card-meta">📅 ${t.date||'—'} ${t.time||''} · 📁 ${t.type?.toUpperCase()||'TODO'}</div>
        </div>
        ${!t.done ? `<div class="card-actions">
            <button class="card-action ca-work${t.isWorking?' active':''}" onclick="toggleWork(${t.id});event.stopPropagation()">${t.isWorking?'⚡ STOP':'🛠️ WORK'}</button>
            <button class="card-action ca-minus" onclick="updateProgress(${t.id},-10);event.stopPropagation()">-10%</button>
            <button class="card-action ca-plus" onclick="updateProgress(${t.id},10);event.stopPropagation()">+10%</button>
            <button class="card-action ca-done" onclick="markDone(${t.id});event.stopPropagation()">✓ DONE</button>
        </div>` : `<div style="font-size:0.6rem; color:var(--sp-green); margin-top:10px; opacity:0.8;">✓ ARCHIVED ${t.finishedDate||''}</div>`}
    `;
    return card;
}

function renderKanban(container, tasks) {
    const cols = [
        { id:'backlog', label:'BACKLOG', filter: t=>!t.done&&(t.progress||0)===0, color:'var(--sp-blue)' },
        { id:'wip', label:'IN PROGRESS', filter: t=>!t.done&&(t.progress||0)>0, color:'var(--sp-teal)' },

    ];
    const wrap = document.createElement('div');
    wrap.className = 'kanban-wrap';

        div.innerHTML = `<div class="kanban-col-header" style="color:${col.color}">${col.label} <span class="kanban-count">${colTasks.length}</span></div>`;
        colTasks.forEach(t => {
            const c = document.createElement('div');
            c.className = 'kanban-card';
            c.id = `kanban-card-${t.id}`;
            c.innerHTML = `<div style="font-weight:700;margin-bottom:5px;">${t.name}</div><div style="font-size:0.55rem;opacity:0.5;">${t.prio} · ${t.date||'—'}</div><div style="height:3px;background:rgba(255,255,255,0.1);margin-top:8px;border-radius:2px;overflow:hidden;"><div style="height:100%;width:${t.progress||0}%;background:${col.color};"></div></div>`;

            div.appendChild(c);
        });
        wrap.appendChild(div);

}

// ===================== STATS =====================
function renderStats(container) {
    const today = new Date().toISOString().split('T')[0];
    const createdToday = db.filter(t => t.createdDate === today).length;
    const doneToday = db.filter(t => t.finishedDate === today).length;
    const pending = db.filter(t => !t.done).length;
    const critical = db.filter(t => !t.done && t.prio === 'sangat-penting').length;

    // Weekly data
    const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    const weekData = [];
    for (let i = 6; i >= 0; i--) {
        const d = new Date(); d.setDate(d.getDate() - i);
        const ds = d.toISOString().split('T')[0];
        weekData.push({ day: days[d.getDay()], val: db.filter(t => t.finishedDate === ds).length });
    }
    const maxW = Math.max(...weekData.map(d=>d.val), 1);

    // Heatmap (last 70 days)
    const heatCells = [];
    for (let i = 69; i >= 0; i--) {
        const d = new Date(); d.setDate(d.getDate() - i);
        const ds = d.toISOString().split('T')[0];
        const cnt = db.filter(t => t.finishedDate === ds).length;
        heatCells.push({ date: ds, cnt });
    }

    // Activity
    const activity = db.filter(t => t.createdDate === today || t.finishedDate === today);

    container.innerHTML = `
    <div style="margin-bottom:24px;">
        <label class="form-label">FILTER DATE</label>
        <input type="date" id="stat-date-filter" class="form-input" style="max-width:200px;" value="${today}" onchange="selectedStatDate=this.value;renderStats(document.getElementById('content-area'))">
    </div>
    <div class="stats-grid">
        <div class="stat-card c-green"><span class="stat-val">${createdToday}</span><span class="stat-lbl">🖋️ CREATED TODAY</span></div>
        <div class="stat-card c-lime" style="--sp-green:var(--sp-lime)"><span class="stat-val" style="color:var(--sp-lime)">${doneToday}</span><span class="stat-lbl">☑️ DONE TODAY</span></div>
        <div class="stat-card c-gold"><span class="stat-val">${pending}</span><span class="stat-lbl">⏳ TOTAL PENDING</span></div>
        <div class="stat-card c-red"><span class="stat-val">${critical}</span><span class="stat-lbl">🔴 CRITICAL</span></div>
    </div>
    <div class="weekly-chart">
        <div class="chart-title">📈 7-DAY COMPLETION CHART</div>
        <div class="bar-chart">${weekData.map(d=>`
            <div class="bar-wrap">
                <span class="bar-val">${d.val}</span>
                <div class="bar" style="flex:1;"><div class="bar-fill" style="height:${d.val/maxW*100}%;"></div></div>
                <span class="bar-day">${d.day}</span>
            </div>`).join('')}
        </div>
    </div>
    <div class="heatmap-wrap">
        <h3>⚡ ACTIVITY HEATMAP (70 DAYS)</h3>
        <div class="heatmap-grid">${heatCells.map(c => {
            const opacity = c.cnt === 0 ? 0.08 : Math.min(0.2 + c.cnt*0.2, 1);
            const bg = c.cnt === 0 ? `rgba(255,255,255,0.05)` : `rgba(5,217,232,${opacity})`;
            return `<div class="heat-cell" style="background:${bg}" title="${c.date}: ${c.cnt} tasks"></div>`;
        }).join('')}</div>
    </div>
    <div class="heatmap-wrap">
        <h3>📌 ACTIVITY ON ${today}</h3>
        ${activity.length ? activity.map(t=>`<div class="log-item"><span>${t.name}</span><span style="color:${t.finishedDate===today?'var(--sp-green)':'var(--sp-gold)'}">[${t.finishedDate===today?'DONE':'CREATED'}]</span></div>`).join('') : '<p style="opacity:0.35;font-size:0.7rem;">No activity for this date.</p>'}
    </div>
    `;
}
