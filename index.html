// ===================== SWIPE-TO-SCROLL =====================
// Ganti scroll biasa dengan gestur geser (swipe ke atas = konten naik,
// persis seperti nge-drag kartu). Berlaku untuk mouse-drag di desktop
// dan touch-swipe di HP/tablet, dipasang di semua panel yang scroll:
// area konten utama, sidebar, log panel, dan modal.
function enableSwipeScroll(el) {
    if (!el || el.dataset.swipeBound) return;
    el.dataset.swipeBound = '1';
    el.classList.add('swipe-scroll');

    let isDown = false, startY = 0, startX = 0, scrollStartTop = 0, moved = false, velocity = 0, lastY = 0, lastT = 0, momentumId = null;

    function pointerDown(clientX, clientY) {
        cancelAnimationFrame(momentumId);
        isDown = true; moved = false; velocity = 0;
        startY = clientY; startX = clientX; lastY = clientY; lastT = Date.now();
        scrollStartTop = el.scrollTop;
        el.classList.add('dragging');
    }
    function pointerMove(clientX, clientY, evt) {
        if (!isDown) return;
        const dy = clientY - startY, dx = clientX - startX;
        if (!moved && (Math.abs(dy) > 6 || Math.abs(dx) > 6)) {
            moved = true;
            el.classList.add('actually-dragging');
        }
        if (!moved) return; // belum dianggap geser, jangan ganggu klik sama sekali
        el.scrollTop = scrollStartTop - dy;
        const now = Date.now(), dt = now - lastT;
        if (dt > 0) velocity = (clientY - lastY) / dt;
        lastY = clientY; lastT = now;
        if (evt && evt.cancelable && Math.abs(dy) > Math.abs(dx)) evt.preventDefault();
    }
    function pointerUp() {
        if (!isDown) return;
        isDown = false;
        el.classList.remove('dragging', 'actually-dragging');
        if (!moved) return; // klik biasa, tidak perlu momentum
        // momentum: lanjutkan geser pelan setelah dilepas, seperti swipe kartu
        let v = -velocity * 16;
        function momentum() {
            if (Math.abs(v) < 0.5) return;
            el.scrollTop += v;
            v *= 0.94;
            momentumId = requestAnimationFrame(momentum);
        }
        momentumId = requestAnimationFrame(momentum);
    }

    el.addEventListener('mousedown', e => {
        if (e.button !== 0 || e.target.closest('input, textarea, select, [contenteditable]')) return;
        pointerDown(e.clientX, e.clientY);
    });
    window.addEventListener('mousemove', e => { pointerMove(e.clientX, e.clientY); });
    window.addEventListener('mouseup', pointerUp);

    el.addEventListener('touchstart', e => {
        if (e.target.closest('input, textarea, select, [contenteditable]')) return;
        const t = e.touches[0]; pointerDown(t.clientX, t.clientY);
    }, { passive: true });
    el.addEventListener('touchmove', e => {
        const t = e.touches[0]; pointerMove(t.clientX, t.clientY, e);
    }, { passive: false });
    el.addEventListener('touchend', pointerUp);
    el.addEventListener('touchcancel', pointerUp);

    // Cegah klik nyasar ke item di dalamnya (task-card, tombol dll) saat habis digeser
    el.addEventListener('click', e => {
        if (moved) { e.stopPropagation(); e.preventDefault(); }
    }, true);
}
function initSwipeScrollAll() {
    enableSwipeScroll(document.getElementById('content-area'));
    enableSwipeScroll(document.querySelector('.sidebar'));
    enableSwipeScroll(document.getElementById('log-list'));
    document.querySelectorAll('.modal').forEach(m => enableSwipeScroll(m));
}
initSwipeScrollAll();

// ===================== AUTO-HIDE HUD KIRI (SIDEBAR) =====================
// Sidebar collapses out of the way and only reappears when the cursor
// approaches the left edge of the screen (or while it's being hovered
// directly). .main is flex:1, so the center content resizes smoothly
// as the sidebar's width animates in/out.
(function initSidebarAutoHide() {
    const sidebar = document.querySelector('.sidebar');
    if (!sidebar) return;
    const EDGE_PX = 24;
    const HIDE_DELAY = 500;
    let hideTimer = null;

    document.body.classList.add('sidebar-autohide');

    function showSidebar() {
        clearTimeout(hideTimer);
        sidebar.classList.add('sb-visible');
        document.body.classList.add('sidebar-open');
    }
    function scheduleHide() {
        clearTimeout(hideTimer);
        hideTimer = setTimeout(() => {
            sidebar.classList.remove('sb-visible');
            document.body.classList.remove('sidebar-open');
        }, HIDE_DELAY);
    }

    document.addEventListener('mousemove', e => {
        if (e.clientX <= EDGE_PX) showSidebar();
    });
    sidebar.addEventListener('mouseenter', showSidebar);
    sidebar.addEventListener('mouseleave', scheduleHide);
    // keep it open on touch devices while tapping inside it
    sidebar.addEventListener('touchstart', showSidebar, { passive: true });
})();

// ===================== INIT =====================
// First paint uses whatever's in the fast local cache (instant, no flicker).
// Then, if a durable backend (window.storage) is available, we pull the
// real persisted data on top of it and re-render - so refreshing the page
// or reopening this artifact later brings everything back.
checkDailyReset();
if (typeof applyHudSize === 'function') applyHudSize(storage.get('sp_hud_size') || 'medium');
updateBadges(); updateEnergy(); updateStreak(); renderLogs(); updateLogBadge(); render();

storage.hydrate(SP_STORAGE_KEYS, function () {
    db = JSON.parse(storage.get('sp_tasks_v5')) || [];
    logs = JSON.parse(storage.get('sp_logs_v5')) || [];
    routineData = JSON.parse(storage.get('sp_routines_v5')) || { pagi:[], siang:[], sore:[], malam:[] };
    moodHistory = JSON.parse(storage.get('sp_moods_v5')) || {};
    journalData = JSON.parse(storage.get('sp_journal_v5')) || {};
    achievements = JSON.parse(storage.get('sp_achievements_v5')) || {};
    finishCount = parseInt(storage.get('sp_streak_v5')) || 0;
    consecutiveDone = parseInt(storage.get('sp_consecutive_v5')) || 0;
    taskCreateMap = JSON.parse(storage.get('sp_task_create_map')) || {};
    idleWarned = JSON.parse(storage.get('sp_idle_warned')) || {};
    if (storage.get('sp_theme') === 'light') document.body.classList.add('light-theme');
    applyHudSize(storage.get('sp_hud_size') || 'medium');

    checkDailyReset();
    updateBadges(); updateEnergy(); updateStreak(); renderLogs(); updateLogBadge(); render();

    if (storage.usingDurable()) {
        pushNotif('☁️ Data permanen berhasil dimuat.', 'notif-green');
    } else if (!storage.isAvailable()) {
        pushNotif('⚠️ Penyimpanan browser diblokir - data hanya tersimpan selama tab ini terbuka.', 'notif-red');
    }
    setTimeout(speakTaskSummary, 800);
});

// ===================== AI VOICE TASK SUMMARY =====================
// Speaks a natural-sounding rundown of pending tasks when the site opens,
// and highlights each task's card on screen right as it's mentioned.

// Pick a male-sounding voice available in the browser. Voice packs differ
// wildly across OS/browser, so we try known male voice names first; if
// none of those exist we fall back to any English voice and compensate
// with a lower pitch in speakText() so it still reads as male.
let AI_VOICE = null;
let AI_VOICE_IS_MALE = false;
const MALE_VOICE_NAMES = [
    'Google UK English Male', 'Microsoft Guy Online (Natural)', 'Microsoft Ryan Online (Natural)',
    'Microsoft David Desktop', 'Microsoft David', 'Microsoft Mark', 'Microsoft James',
    'Daniel', 'Alex', 'Fred', 'Oliver', 'Arthur', 'Tom', 'Aaron', 'Google Bahasa Indonesia'
];
function pickAiVoice() {
    if (!('speechSynthesis' in window)) return null;
    const voices = window.speechSynthesis.getVoices();
    if (!voices.length) return null;
    for (const name of MALE_VOICE_NAMES) {
        const v = voices.find(v => v.name.includes(name));
        if (v) { AI_VOICE_IS_MALE = true; return v; }
    }
    AI_VOICE_IS_MALE = false;
    return voices.find(v => v.lang && v.lang.startsWith('en')) || voices[0];
}
if ('speechSynthesis' in window) {
    AI_VOICE = pickAiVoice();
    window.speechSynthesis.onvoiceschanged = () => { AI_VOICE = pickAiVoice(); };
}

// Speaks one chunk of text. rate/pitch get a small random wobble each call
// so back-to-back utterances don't sound flat and mechanical. Pitch is
// centered lower to read as a male voice — lower still if we couldn't
// find an actual male voice pack and need to fake it.
function speakText(text, opts = {}) {
    if (!('speechSynthesis' in window)) return null;
    try {
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'en-US';
        if (AI_VOICE) utter.voice = AI_VOICE;
        const basePitch = AI_VOICE_IS_MALE ? 0.94 : 0.76;
        utter.rate = opts.rate || (0.98 + (Math.random() * 0.08 - 0.04));
        utter.pitch = opts.pitch || (basePitch + (Math.random() * 0.06 - 0.03));
        utter.volume = 0.85;
        if (opts.onstart) utter.onstart = opts.onstart;
        if (opts.onend) utter.onend = opts.onend;
        window.speechSynthesis.speak(utter);
        return utter;
    } catch (e) { return null; }
}

// Highlights the element that's currently being mentioned — a modest
// scale-up + glow, not an oversized pop — and clears any previous
// highlight so only one item is ever lit up at a time.
function highlightAiMention(elId, holdMs = 1600) {
    document.querySelectorAll('.ai-highlight').forEach(el => el.classList.remove('ai-highlight'));
    const el = document.getElementById(elId);
    if (!el) return;
    el.classList.add('ai-highlight');
    el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    clearTimeout(el._aiHighlightTimer);
    el._aiHighlightTimer = setTimeout(() => el.classList.remove('ai-highlight'), holdMs);
}

// Stops whatever the AI is currently saying (and clears any lingering
// highlight) so a new section's summary never overlaps or gets buried
// under the previous one — switching tabs always cuts cleanly to the
// new context instead of piling audio on top of audio.
function stopAiSpeech() {
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    document.querySelectorAll('.ai-highlight').forEach(el => {
        clearTimeout(el._aiHighlightTimer);
        el.classList.remove('ai-highlight');
    });
}

// Speaks an intro line, then one utterance per item (highlighting that
// item's card the instant it's spoken), then an optional closing line.
function speakMentioningItems(intro, items, outro) {
    if (!('speechSynthesis' in window)) return;
    const basePitch = AI_VOICE_IS_MALE ? 0.94 : 0.76;
    const rate = 0.98 + (Math.random() * 0.06 - 0.03);
    const pitch = basePitch + (Math.random() * 0.05 - 0.025);
    if (intro) speakText(intro, { rate, pitch });
    items.forEach((item, i) => {
        const isLast = i === items.length - 1;
        speakText(item.text + (isLast ? '.' : ','), {
            rate, pitch,
            onstart: () => highlightAiMention(item.elId)
        });
    });
    if (outro) speakText(outro, { rate, pitch });
}

// A handful of casual openers/closers so it doesn't say the exact same
// robotic line every single time — picked at random per call.
function pickOne(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function speakTaskSummary() {
    stopAiSpeech(); // never overlap with any speech that might already be playing
    const pending = db.filter(t => !t.done);
    if (!pending.length) {
        const line = pickOne([
            "You're all clear, no tasks on the board. Want to add one?",
            "Nothing pending right now. Want to add a task?",
            "Your list is empty for now. Should we add something?"
        ]);
        pushAiNotif(line);
        speakText(line);
        return;
    }
    const intro = pickOne([
        "Alright, here's what's on your plate.",
        "Okay, let's see what you've got going on.",
        "Here's a quick rundown of your tasks."
    ]);
    pushAiNotif(`Here's what's on your plate: ${pending.map(t => t.name).join(', ')}`);
    speakMentioningItems(
        intro,
        pending.map(t => ({ text: t.name, elId: `card-${t.id}` })),
        pending.length > 1 ? `That's ${pending.length} tasks in total.` : null
    );
}
// (initial speakTaskSummary call happens inside storage.hydrate()'s
// callback near the INIT section above, once real persisted tasks load)

// AI voice summary triggered specifically when opening PROJECTS, ROUTINES,
// or ARCHIVE from the sidebar nav — same natural, mention-and-highlight
// style as the opening task summary above, but scoped to that section.
// Always cuts off any summary still playing from a tab you just left,
// so it stays focused on the tab you just opened instead of stacking.
function speakTabSummary(tab) {
    stopAiSpeech();
    if (tab === 'project') {
        const items = db.filter(t => !t.done && t.type === 'project');
        if (!items.length) {
            const line = "No active projects right now. Want to start one?";
            pushAiNotif(line); speakText(line);
            return;
        }
        pushAiNotif(`Here are your projects: ${items.map(t => t.name).join(', ')}`);
        speakMentioningItems(
            pickOne(["Here's what you're building.", "Let's check your projects.", "Here's where things stand."]),
            items.map(t => ({ text: t.name, elId: `card-${t.id}` })),
            null
        );
    } else if (tab === 'routines') {
        const all = [];
        Object.keys(routineData).forEach(sec => (routineData[sec] || []).forEach((r, i) => all.push({ text: r.text, elId: `routine-item-${sec}-${i}` })));
        if (!all.length) {
            const line = "No routines set up yet. Want to add a few?";
            pushAiNotif(line); speakText(line);
            return;
        }
        pushAiNotif(`Here are your routines: ${all.map(r => r.text).join(', ')}`);
        speakMentioningItems(
            pickOne(["Here's your routine.", "Let's walk through your day.", "Here's what's on the schedule."]),
            all,
            null
        );
    } else if (tab === 'done') {
        const items = db.filter(t => t.done);
        if (!items.length) {
            const line = "Your archive is empty, nothing completed just yet.";
            pushAiNotif(line); speakText(line);
            return;
        }
        pushAiNotif(`Archive summary: ${items.map(t => t.name).join(', ')}`);
        speakMentioningItems(
            `Nice work, you've wrapped up ${items.length} ${items.length === 1 ? 'task' : 'tasks'}.`,
            items.map(t => ({ text: t.name, elId: `card-${t.id}` })),
            null
        );
    }
}

// Light theme (optional)
const savedTheme = storage.get('sp_theme');
if (savedTheme === 'light') document.body.classList.add('light-theme');
const __toggleTheme = toggleTheme;
toggleTheme = function() {
    __toggleTheme();
    storage.set('sp_theme', document.body.classList.contains('light-theme') ? 'light' : 'dark');
};
</script>
</body>
